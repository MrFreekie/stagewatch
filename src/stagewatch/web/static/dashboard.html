<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Stagewatch</title>
<script src="/static/compat.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<noscript><p style="padding:16px;font-size:20px">Stagewatch needs JavaScript. Turn JavaScript on in your browser settings, then reload this page.</p></noscript>
<div class="banner-emulate" id="emulate" hidden>EMULATE MODE: simulated sensors, not real data</div>
<header class="top">
  <span class="conn" id="conn" title="Live connection"></span>
  <span class="title" id="title">Stagewatch</span>
  <span class="sub" id="show"></span>
  <span class="spacer"></span>
  <button class="theme-toggle" id="theme-toggle" type="button"></button>
  <button class="sound-toggle" id="sound-toggle" type="button" aria-pressed="false"><span class="sound-icon" aria-hidden="true"></span><span id="sound-label">Alarm sound: Off</span></button>
  <span class="clock" id="clock"></span>
</header>
<main id="main">
  <!-- Always shown (not a card): the alarm banner. -->
  <div class="alarm-bar" id="alarms">
    <ul id="alarm-list"></ul>
    <button class="primary only-interactive" id="ack" hidden>Acknowledge</button>
  </div>

  <p class="muted" id="no-cards" hidden>No cards are switched on for this screen. Alarms still show here. To choose cards, go to Admin → User dashboards → Edit cards.</p>

  <!-- Cards: dashboard.js shows the ones this dashboard lists, in its order. -->
  <section class="tiles" data-card="env_tiles" id="tiles" hidden></section>

  <section class="card" data-card="schedule" id="schedule-card" hidden>
    <h2>Schedule</h2>
  </section>

  <section class="card" data-card="chart" hidden>
    <h2>
      <span>History</span><span class="grow"></span>
      <span class="seg" id="series-seg"></span>
      <span class="seg" id="span-seg"></span>
    </h2>
    <div class="chart-wrap"><canvas id="chart"></canvas></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="card" data-card="markers" id="markers-card" hidden>
    <h2>Markers</h2>
    <form class="row only-interactive" id="marker-form" hidden>
      <input id="marker-label" maxlength="120" placeholder="e.g. Aligned, Doors, Headliner" style="flex:1;min-width:160px">
      <button class="primary" type="submit">Add marker</button>
    </form>
    <div class="markers"><ul id="marker-list"></ul></div>
    <label class="marker-hidden-toggle" id="marker-hidden-toggle" hidden><input type="checkbox" id="marker-show-hidden"> <span id="marker-hidden-label">Show hidden</span></label>
    <div class="delta" id="delta" hidden></div>
  </section>

  <section class="card" data-card="sensors" hidden>
    <h2>Sensors</h2>
    <div class="table-scroll"><table id="sensors"></table></div>
    <p class="notice" id="site-note"></p>
  </section>

  <section class="card" data-card="barometer" id="barometer-card" hidden>
    <h2>Barometer</h2>
  </section>

  <section class="card" data-card="wall_clock" id="wall-clock-card" hidden>
    <h2>Wall Clock</h2>
  </section>
</main>
<footer class="wall-address" data-card="connect_footer" id="wall-address" hidden></footer>
<script src="/static/vendor/qrcode.js"></script>
<script src="/static/common.js"></script>
<script src="/static/chart.js"></script>
<script src="/static/wallclock.js"></script>
<script src="/static/barometer.js"></script>
<script src="/static/dashboard.js"></script>
</body>
</html>
