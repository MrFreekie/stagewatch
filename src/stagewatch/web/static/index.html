<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stagewatch</title>
<script src="/static/compat.js"></script>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<noscript><p style="padding:16px;font-size:20px">Stagewatch needs JavaScript. Turn JavaScript on in your browser settings, then reload this page.</p></noscript>
<header class="top">
  <img class="brand brand-l" alt="" hidden><img class="brand brand-d" alt="" hidden>
  <span class="title">Stagewatch</span>
  <span class="sub" id="site"></span>
  <span class="spacer"></span>
  <button class="theme-toggle" id="theme-toggle" type="button"></button>
  <a href="/admin">Admin</a>
</header>
<main>
  <div class="card">
    <h2>Dashboards</h2>
    <div class="tiles" id="list"></div>
    <p class="notice">Bookmark a dashboard URL, or open it in kiosk mode on a display.</p>
  </div>
</main>
<footer class="site-footer">Stagewatch is free, open-source and 100% vibe coded. If it helps your shows: <a href="https://buymeacoffee.com/fohengineer" target="_blank" rel="noopener noreferrer">buy me a coffee ☕</a></footer>
<script src="/static/common.js"></script>
<script>
// Day / Night, as on the dashboards and Admin: follows the device until tapped, then this browser
// remembers the choice (the same setting the dashboards on this device use).
(function () {
  const KEY = "stagewatch.theme", btn = document.getElementById("theme-toggle");
  const isDay = () => {
    const t = document.documentElement.getAttribute("data-theme");
    return t ? t === "light" : !!(window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches);
  };
  const apply = (pick) => {
    if (pick === "day" || pick === "night") document.documentElement.setAttribute("data-theme", pick === "day" ? "light" : "dark");
    else document.documentElement.removeAttribute("data-theme");
    const day = isDay();
    btn.textContent = day ? "☾ Night" : "☀ Day";   // what a tap switches to
    btn.setAttribute("aria-label", day ? "Switch to night mode (dark)" : "Switch to day mode (light)");
  };
  btn.addEventListener("click", () => {
    const pick = isDay() ? "night" : "day";
    try { localStorage.setItem(KEY, pick); } catch (_) { /* not remembered; still switches */ }
    apply(pick);
  });
  let saved = "";
  try { saved = localStorage.getItem(KEY) || ""; } catch (_) { /* private mode: follow the device */ }
  apply(saved);
})();
</script>
<script>
(async () => {
  const info = await SW.api("GET", "/api/info");
  document.getElementById("site").textContent = `${info.site} · v${info.version}`;
  SW.applyBranding(info, "show_on_index");
  const list = document.getElementById("list");
  for (const d of info.dashboards) {
    list.append(SW.h("a", { class: "tile", href: `/d/${encodeURIComponent(d.slug)}`, style: "text-decoration:none;color:inherit" },
      SW.h("div", { class: "label" }, d.layout),
      SW.h("div", { class: "value", style: "font-size:24px" }, d.title || d.slug),
      SW.h("div", { class: "foot" }, `/d/${d.slug}`)));
  }
  if (info.admin_setup_required || info.recovery_required) location.href = "/admin";
})();
</script>
</body>
</html>
