# Stagewatch single-sensor ENVIRONMENT node: Seeed XIAO ESP32C3 + Bosch BME280
# (temperature, humidity, pressure) on a STEMMA QT port soldered to the XIAO's I2C
# pins. Wi-Fi 4 (2.4 GHz). Use one file for each C3 and change node_name /
# friendly_name / api key.
#
# *** NOT YET TESTED ON HARDWARE. Validated with `esphome config` only. ***
#
# Role: ENVIRONMENT node (air conditions). Its readings feed the Stagewatch site
# average, speed of sound and barometer.
#
# Accuracy: the BME280 reads slightly warm from its own self-heating (and the
# board's), which also makes humidity read a little low, and it is less accurate
# than the SHT45 + DPS310 pair (stagewatch-xiao-esp32c3-dps310-sht45.yaml). Use
# this node where "good enough and cheap" is right; trim offsets in the Stagewatch
# admin after comparing against a better sensor.
#
# *** WI-FI: FIT THE 2.4 GHz ANTENNA FIRST ***
#   The XIAO ESP32C3 has a U.FL (IPEX) antenna socket and its Wi-Fi is weak or
#   absent without the small 2.4 GHz antenna fitted (Seeed: the board "includes an
#   external antenna" on a U.FL-R-SMT1 connector). Fit it before you power the
#   board; press the plug straight down, never pull on the lead. If the WiFi signal
#   reads about -80 dBm or worse, or the node keeps dropping, move it, keep it
#   clear of metal racks and cases, or fit a larger antenna: see "Built-in or
#   external antenna?" in docs/pressure-nodes.md. Unlike the C6, the C3 has no
#   antenna-select switch: nothing to enable in this file. Source:
#   https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/
#
# Hardware:
#   - Seeed XIAO ESP32C3 (board id seeed_xiao_esp32c3) with a STEMMA QT / Qwiic
#     (JST SH 4-pin) connector soldered to the I2C pins (see Wiring).
#   - A BME280 STEMMA QT breakout (check the part's page for its I2C address and
#     that it takes 3.3 V).
#   - STEMMA QT cable (4-pin JST SH). USB-C data cable and a stable 5 V supply.
#
# Wiring (STEMMA QT cable colours: red 3V3, black GND, blue SDA, yellow SCL):
#   XIAO pad           GPIO    STEMMA QT pin   Wire
#   3V3                -       3V3 (V+)        red
#   GND                -       GND             black
#   D4 (SDA)           GPIO6   SDA             blue
#   D5 (SCL)           GPIO7   SCL             yellow
#   Seeed pin map: D4 = SDA = GPIO6 and D5 = SCL = GPIO7
#   (https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/). ESPHome's own
#   default I2C pins for the ESP32-C3 are GPIO8 / GPIO9, which are NOT the XIAO's
#   D4 / D5, so the pins are set explicitly below.
#   Check the 3V3 pad of your soldered connector with a meter before connecting.
#
# I2C address: 0x77 by default, 0x76 on the alternate address (set bme280_address
# below to match your breakout; see its page). Chip id 0x60 = BME280 (0x58 would be
# a BMP280, which has no humidity). The i2c scan below logs what it finds.
#
# ESPHome options (https://esphome.io/components/sensor/bme280/, platform
# bme280_i2c): address (default 0x77), oversampling per measurement (default 16x),
# iir_filter (default OFF), update_interval (default 60 s). Pressure is hPa;
# Stagewatch converts to Pa.
#
# Stagewatch entities (mapping.py: device_class decides the Kind):
#   "Temperature" device_class temperature, degC          -> Kind.TEMPERATURE
#   "Humidity"    device_class humidity, %                -> Kind.HUMIDITY
#   "Pressure"    device_class atmospheric_pressure, hPa  -> Kind.PRESSURE (Pa)
#   "WiFi signal" device_class signal_strength, dBm       -> Kind.SIGNAL
#   "Uptime"      diagnostic, seconds, no device_class    -> Kind.GENERIC
#   (no battery gauge on this board, so no Battery entity)
#
# Status light: the Seeed wiki lists no user LED on the XIAO ESP32C3 (it says there
# is no LED_BUILTIN; the only on-board light is the charge LED), so this node has no
# status light. Use the node list in Stagewatch admin to see whether it is connected.
#
# No controllable outputs: this node has only sensors, so the native API exposes
# nothing that can be switched.
#
# Mounting: the XIAO and USB supply warm the air around them. Hang the BME280 on a
# STEMMA QT cable 5 to 10 cm or more from the board, in free, shaded air (below or
# beside the XIAO, not above it), out of sun, lamps, amp racks and draughts. It
# needs the outside static pressure: no sealed box. Use a vented housing, a
# radiation shield outdoors, and strain relief on the USB lead.
#
# First flash (USB): copy secrets.example.yaml to secrets.yaml and fill it in.
# Hold BOOT, plug in USB, release BOOT (or press RESET once), per Seeed, then
#     esphome run stagewatch-xiao-esp32c3-bme280.yaml
# Later updates go over Wi-Fi (OTA). The api_encryption_key comes from
# secrets.yaml (one key per node is best); paste it into Stagewatch when adopting.
# Secrets used: wifi_ssid, wifi_password, ota_password, api_encryption_key,
# wifi_ap_password.
#
# Status: NOT YET TESTED ON HARDWARE. Validated with `esphome config` only.

substitutions:
  node_name: stagewatch-env-c3-2        # unique per node: becomes <name>.local
  friendly_name: "Stagewatch Env C3 2"
  # BME280: "0x77" by default; "0x76" on the alternate address.
  bme280_address: "0x77"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG        # native USB; drop if you see no logs

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.51
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Several networks (see the guide, "Moving between sites"): replace ssid and
  # password above with a `networks:` list of ssid / password pairs, e.g.
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid_2
  #     password: !secret wifi_password_2
  # (add wifi_ssid_2 / wifi_password_2 to secrets.yaml first).
  # Fallback access point if the node cannot join Wi-Fi.
  ap:
    ssid: "${node_name}"
    password: !secret wifi_ap_password

captive_portal:

i2c:
  sda: GPIO6                            # D4
  scl: GPIO7                            # D5
  frequency: 100kHz
  scan: true

sensor:
  - platform: bme280_i2c
    address: ${bme280_address}
    update_interval: 5s
    iir_filter: 4x
    temperature:
      name: "Temperature"
      accuracy_decimals: 2
      oversampling: 4x
    humidity:
      name: "Humidity"
      accuracy_decimals: 1
      oversampling: 4x
    pressure:
      name: "Pressure"                  # hPa; Stagewatch converts to Pa
      device_class: atmospheric_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2
      oversampling: 4x

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
