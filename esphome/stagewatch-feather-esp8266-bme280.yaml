# Stagewatch environment node: Adafruit Feather HUZZAH ESP8266 (product 2821) +
# BME280 (temperature, humidity, pressure) OR BMP280 (temperature, pressure,
# NO humidity) on I2C. Wi-Fi. The owner is not sure which chip is fitted, so this
# file is written for the BME280 with a marked 3-line BMP280 swap below.
# Candidate hardware: not a core node.
#
# Hardware:
#   - Adafruit Feather HUZZAH ESP8266 (2821), headers soldered
#   - BME280 or BMP280 I2C breakout (3.3 V logic, or a 5 V board with regulator
#     and level shifting: power it from the HUZZAH 3V pin)
#   - 4 jumper wires or a breadboard; USB micro-B data cable and a stable 5 V supply.
#     Optional protected 3.7 V LiPo (JST-PH; check polarity). No battery gauge.
#
# Wiring (colour-coded):
#   HUZZAH pin    GPIO    BME/BMP280 pin   Wire
#   3V            -       VIN / VCC        red
#   GND           -       GND              black
#   SDA           GPIO4   SDA / SDI        blue
#   SCL           GPIO5   SCL / SCK        yellow
#   (CS / CSB to 3V3 selects I2C on bare modules; SDO / ADDR low = 0x76,
#   high = 0x77. GPIO4 / GPIO5 are the HUZZAH's default I2C pins; set
#   explicitly below.)
#
# Which chip is it? Flash, then read the first-boot log (esphome logs <file>):
#   - The i2c scan lists the address: 0x76 or 0x77. Use that value for `address`.
#     (Most Adafruit boards are 0x77; cheap blue/purple modules are usually 0x76.)
#   - The sensor setup log shows the chip id: BME280 = 0x60, BMP280 = 0x58
#     (older BMP280 samples may read 0x56 / 0x57). With the wrong platform the
#     sensor logs a chip-id error and is marked failed.
#   - If there is no "Humidity" entity or it reads nothing, or the id is 0x58,
#     it is a BMP280: do the 3-line swap in the sensor block below.
#   - The chips look identical; BME280 packages are often marked with a
#     rectangular metal lid, but do not rely on it.
#
# ESPHome options (https://esphome.io/components/sensor/bme280/ and
# https://esphome.io/components/sensor/bmp280/): address, update_interval,
# temperature / pressure (/ humidity, BME280 only) with oversampling and
# filters; the BMP280 platform has an iir_filter. Checked against ESPHome 2026.9.1.
# Pressure is hPa; Stagewatch converts to Pa.
#
# Stagewatch entities (mapping.py: device_class decides the Kind):
#   "Temperature" temperature, degC             -> Kind.TEMPERATURE
#   "Humidity"    humidity, %  (BME280 only)    -> Kind.HUMIDITY
#   "Pressure"    atmospheric_pressure, hPa     -> Kind.PRESSURE (Pa)
#   "WiFi signal" signal_strength, dBm          -> Kind.SIGNAL
#   (no battery gauge, so no Battery entity)
#
# Mounting: the breakout reads 1-2 degC high if close to the Feather's
# regulator and Wi-Fi radio heat, so keep it on a short lead away from the board,
# out of sun, lamps and amp heat, and not in a sealed case (it must see outside
# static pressure and air). Neither chip is waterproof: use a vented housing
# and give the USB lead strain relief. Calibrate against a reference
# thermometer with the per-sensor offset in the Stagewatch admin (not also an
# offset filter here). ESP8266 has less RAM and Wi-Fi robustness than the ESP32
# nodes: do not use it as the only environment source on a critical site.
#
# First flash (USB): copy secrets.example.yaml to secrets.yaml and fill it in.
# Hold the GPIO0 button, press and release RESET, release GPIO0, then
#     esphome run stagewatch-feather-esp8266-bme280.yaml
# (the CP2104 usually enters the bootloader automatically, so try without the
# buttons first). Later updates go over Wi-Fi (OTA). Use a different
# api_encryption_key per node (paste the same key into Stagewatch). Secrets
# used: wifi_ssid, wifi_password, ota_password, api_encryption_key,
# wifi_ap_password.
#
# Status: validated with `esphome config`; untested on hardware.

substitutions:
  node_name: stagewatch-env-esp8266-1  # unique per node: becomes <name>.local
  friendly_name: "Stagewatch Env ESP8266 1"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on: status_led       # lit = booting / no hub

esp8266:
  board: huzzah

logger:

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min
  on_client_connected:
    - light.turn_off: status_led        # off = all well
  on_client_disconnected:
    - light.turn_on: status_led

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.53
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Several networks (see the guide, "Moving between sites"): replace ssid and
  # password above with a `networks:` list of ssid / password pairs, e.g.
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid_2
  #     password: !secret wifi_password_2
  # (add wifi_ssid_2 / wifi_password_2 to secrets.yaml first).
  # Fallback access point if the node cannot join Wi-Fi.
  ap:
    ssid: "${node_name}"
    password: !secret wifi_ap_password
  on_disconnect:
    - light.turn_on: status_led

captive_portal:

i2c:
  sda: GPIO4
  scl: GPIO5
  frequency: 100kHz
  scan: true

# Status LED: the blue LED on GPIO2 (active low). Off normally, lit when Wi-Fi or
# the hub connection is lost.
output:
  - platform: esp8266_pwm
    id: user_led
    pin:
      number: GPIO2
      inverted: true

light:
  - platform: monochromatic
    id: status_led
    internal: true
    output: user_led
    restore_mode: ALWAYS_OFF

sensor:
  # --- BME280 (chip id 0x60): temperature, humidity, pressure ---
  - platform: bme280_i2c
    address: 0x76                       # 0x77 on Adafruit and some other boards
    update_interval: 5s
    temperature:
      name: "Temperature"
      oversampling: 16x
    humidity:
      name: "Humidity"
    pressure:
      name: "Pressure"                  # hPa; Stagewatch converts to Pa
      oversampling: 16x

  # --- BMP280 ALTERNATIVE (chip id 0x58): delete the BME280 block above and
  # --- uncomment this block (3 lines; no humidity). Keep the address from the scan.
  # - platform: bmp280_i2c
  #   address: 0x76
  #   temperature: { name: "Temperature", oversampling: 16x }
  #   pressure: { name: "Pressure", oversampling: 16x }
  #   update_interval: 5s

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s
