# Stagewatch environment node: ESP32 + BME280 (temperature, humidity, pressure).
#
# Flash with ESPHome (https://esphome.io):  esphome run stagewatch-env.yaml
# Copy secrets.example.yaml to secrets.yaml first and fill it in; secrets.yaml
# is gitignored and must never be committed.
#
# Wiring (ESP32 DevKit): BME280 VCC->3V3, GND->GND, SDA->GPIO21, SCL->GPIO22.
# Mount the BME280 on a short lead away from the ESP32 and out of direct sun or
# lamp heat: the board's own heat can read 1-2 degC high. Calibrate against a
# reference thermometer in the Stagewatch admin (per-sensor offset).

substitutions:
  node_name: stagewatch-env-1          # unique per node: becomes <name>.local
  friendly_name: "Stagewatch env 1"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

# Native API: Stagewatch connects to this. Encryption is strongly recommended;
# paste the same key into Stagewatch when adopting the node.
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

sensor:
  - platform: bme280_i2c
    address: 0x76                      # 0x77 on some breakout boards
    update_interval: 5s
    temperature:
      name: "Temperature"
      oversampling: 16x
    humidity:
      name: "Humidity"
    pressure:
      name: "Pressure"                 # reported in hPa; Stagewatch converts

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s
