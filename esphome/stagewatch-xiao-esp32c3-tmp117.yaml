# Stagewatch EQUIPMENT temperature node: Seeed XIAO ESP32C3 + TI TMP117
# high-accuracy temperature sensor on a STEMMA QT port soldered to the XIAO's I2C
# pins. Intended for an amp rack (exhaust or inlet air of the rack, or a heatsink
# surface). Wi-Fi 4 (2.4 GHz). Use one file for each C3 and change node_name /
# friendly_name / api key.
#
# *** NOT YET TESTED ON HARDWARE. Validated with `esphome config` only. ***
#
# Role: EQUIPMENT node (racks, fans, PSUs). In Stagewatch admin, set this node's
# role to Equipment BEFORE relying on it: the file cannot do that for you. A rack
# temperature must never feed the site average, speed of sound or barometer, and
# the device_class below (temperature) would otherwise be averaged like air.
# Alarm / warning thresholds are NOT set here: choose them in Stagewatch for your
# own gear (advisory only; this node never controls anything).
#
# *** WI-FI: FIT THE 2.4 GHz ANTENNA FIRST ***
#   The XIAO ESP32C3 has a U.FL (IPEX) antenna socket and its Wi-Fi is weak or
#   absent without the small 2.4 GHz antenna fitted (Seeed: the board "includes an
#   external antenna" on a U.FL-R-SMT1 connector). Fit it before you power the
#   board; press the plug straight down, never pull on the lead. A metal amp rack
#   blocks Wi-Fi: if the WiFi signal reads about -80 dBm or worse, or the node keeps
#   dropping, route an external antenna outside the rack or use a wired node; see
#   "Built-in or external antenna?" in docs/nodes/pressure-nodes.md. Unlike the C6, the C3
#   has no antenna-select switch: nothing to enable in this file. Source:
#   https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/
#
# Hardware:
#   - Seeed XIAO ESP32C3 (board id seeed_xiao_esp32c3) with a STEMMA QT / Qwiic
#     (JST SH 4-pin) connector soldered to the I2C pins (see Wiring).
#   - A TMP117 STEMMA QT breakout (check the part's page for its I2C address and
#     that it takes 3.3 V).
#   - STEMMA QT cable (4-pin JST SH); lengthen only with care (I2C is meant for
#     short runs, keep it well under 1 m). USB-C data cable, stable 5 V supply.
#
# Wiring (STEMMA QT cable colours: red 3V3, black GND, blue SDA, yellow SCL):
#   XIAO pad           GPIO    STEMMA QT pin   Wire
#   3V3                -       3V3 (V+)        red
#   GND                -       GND             black
#   D4 (SDA)           GPIO6   SDA             blue
#   D5 (SCL)           GPIO7   SCL             yellow
#   Seeed pin map: D4 = SDA = GPIO6 and D5 = SCL = GPIO7
#   (https://wiki.seeedstudio.com/XIAO_ESP32C3_Getting_Started/). ESPHome's own
#   default I2C pins for the ESP32-C3 are GPIO8 / GPIO9, which are NOT the XIAO's
#   D4 / D5, so the pins are set explicitly below.
#   Check the 3V3 pad of your soldered connector with a meter before connecting.
#
# I2C address: 0x48 by default (ADD0 tied to GND); the chip can also be 0x49 (ADD0
# to V+), 0x4A (to SDA) or 0x4B (to SCL) (https://esphome.io/components/sensor/tmp117/).
# Set tmp117_address below if you change it. The i2c scan logs what it finds.
#
# ESPHome options (https://esphome.io/components/sensor/tmp117/): address
# (default 0x48), update_interval (default 60 s; the component uses it to set the
# sensor's averaging). Here 5 s.
#
# Stagewatch entities (mapping.py: device_class decides the Kind):
#   "Rack temperature" device_class temperature, degC     -> Kind.TEMPERATURE
#                        (set the node to Equipment so it is not averaged as air)
#   "WiFi signal"      device_class signal_strength, dBm  -> Kind.SIGNAL
#   "Uptime"           diagnostic, seconds, no device_class -> Kind.GENERIC
#
# Status light: the Seeed wiki lists no user LED on the XIAO ESP32C3 (it says there
# is no LED_BUILTIN; the only on-board light is the charge LED), so this node has no
# status light. Use the node list in Stagewatch admin to see whether it is connected.
#
# No controllable outputs: this node has only sensors, so the native API exposes
# nothing that can be switched.
#
# Mounting: put the TMP117 where the question is (rack exhaust, a heatsink or the
# warm side of the rack) on its own short lead, and keep the XIAO itself in cooler
# air away from the heat it is measuring, because the board's own warmth is not
# the rack's. Mount the sensor so it touches or faces what you want to measure and
# is not shielded from its airflow; tape or clip it, do not let it lie on live
# terminals or mains parts (this is a low-voltage board: nothing mains-connected
# belongs on it, and any work inside a powered rack is for a qualified person). A
# metal rack blocks Wi-Fi (see the antenna note). Add strain relief on the USB lead.
#
# First flash (USB): copy secrets.example.yaml to secrets.yaml and fill it in.
# Hold BOOT, plug in USB, release BOOT (or press RESET once), per Seeed, then
#     esphome run stagewatch-xiao-esp32c3-tmp117.yaml
# Later updates go over Wi-Fi (OTA). The api_encryption_key comes from
# secrets.yaml (one key per node is best); paste it into Stagewatch when adopting.
# Secrets used: wifi_ssid, wifi_password, ota_password, api_encryption_key,
# wifi_ap_password.
#
# Status: NOT YET TESTED ON HARDWARE. Validated with `esphome config` only.

substitutions:
  node_name: stagewatch-rack-c3-1       # unique per node: becomes <name>.local
  friendly_name: "Stagewatch Rack C3 1"
  tmp117_address: "0x48"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: seeed_xiao_esp32c3
  variant: esp32c3
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG        # native USB; drop if you see no logs

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.51
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Several networks (see the guide, "Moving between sites"): replace ssid and
  # password above with a `networks:` list of ssid / password pairs, e.g.
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid_2
  #     password: !secret wifi_password_2
  # (add wifi_ssid_2 / wifi_password_2 to secrets.yaml first).
  # Fallback access point if the node cannot join Wi-Fi.
  ap:
    ssid: "${node_name}"
    password: !secret wifi_ap_password

captive_portal:

i2c:
  sda: GPIO6                            # D4
  scl: GPIO7                            # D5
  frequency: 100kHz
  scan: true

sensor:
  - platform: tmp117
    address: ${tmp117_address}
    update_interval: 5s
    name: "Rack temperature"
    device_class: temperature
    unit_of_measurement: "°C"
    accuracy_decimals: 2

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s

  - platform: uptime
    name: "Uptime"
    entity_category: diagnostic
    update_interval: 60s
