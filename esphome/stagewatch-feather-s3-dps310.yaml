# Stagewatch barometric-pressure node: Adafruit ESP32-S3 Feather (product 5477,
# 4MB flash, 2MB PSRAM) + Adafruit DPS310 precision barometric sensor (product
# 4494) on STEMMA QT. Wi-Fi. One of four pressure and environment nodes (see also
# stagewatch-xiao-esp32c6-dps310.yaml, stagewatch-feather-esp8266-mpl3115a2.yaml and
# stagewatch-feather-esp8266-bme280.yaml).
#
# Hardware (no soldering):
#   - Adafruit ESP32-S3 Feather, 4MB Flash, 2MB PSRAM (5477)
#   - Adafruit DPS310 breakout (4494), STEMMA QT
#   - STEMMA QT cable, 100 mm or longer, Feather port to the DPS310
#   - USB-C data cable and a stable 5 V supply. Optional protected 3.7 V LiPo
#     (JST-PH, check the +/- markings: many packs are reversed).
#
# Wiring (STEMMA QT cable, for reference; Adafruit pinout):
#   Feather SDA = GPIO3  -> DPS310 SDA (blue wire)
#   Feather SCL = GPIO4  -> DPS310 SCL (yellow wire)
#   3V3 / GND            -> DPS310 VIN / GND (red / black wire)
#   The STEMMA QT port's 3V3 is switched by GPIO7 (I2C_POWER): it must be
#   driven HIGH or the sensor is unpowered; this config does that at boot.
#   On-board NeoPixel: data GPIO33, power-enable GPIO21 (driven HIGH below).
#   Boot button: GPIO0.
#
# I2C address: 0x77 by default; 0x76 if you bridge the SDO/address jumper on the
# breakout (see the Adafruit 4494 guide). The i2c scan below logs what it finds.
#
# ESPHome options (https://esphome.io/components/sensor/dps310/): address,
# update_interval, temperature, pressure. There is NO oversampling / precision
# option: the driver uses fixed settings, so smoothing is done with the filter
# below. Checked against ESPHome 2026.9.1. The pressure is reported in hPa;
# Stagewatch converts hPa to Pa on import, so no conversion is done here.
#
# Sensor facts: absolute accuracy about +/-1 hPa, relative accuracy about
# +/-0.06 hPa. Each sensor has its own offset, so trim it in the Stagewatch
# admin (per-sensor offset) against a reference or the local airport QNH, not in
# this file. The sensor reads static pressure, so keep it out of wind and
# fan/blower airflow and out of sealed boxes (pressure must equal the outside air).
#
# Stagewatch entities (mapping.py: device_class decides the Kind):
#   "Pressure"    device_class atmospheric_pressure, hPa -> Kind.PRESSURE (Pa)
#   "Battery"     device_class battery, %                -> Kind.BATTERY
#   "Battery voltage"                                    -> generic
#   "WiFi signal" device_class signal_strength, dBm      -> Kind.SIGNAL
#
# Temperature: the DPS310 temperature is the DIE temperature (used internally
# to compensate pressure), not the air temperature. Stagewatch classes anything
# with device_class temperature as a site temperature and averages it, so it is
# DISABLED here, the same convention as the chip temperature in
# stagewatch-s3-tft-ms8607.yaml. If you enable it (useful to diagnose heating),
# untick "Average" for it in Stagewatch admin (Sensors: calibration & averaging).
#
# Mounting: the Feather, its regulator and any LiPo make heat and pressure
# sensors drift with temperature, so use the long cable and mount the DPS310
# away from the board, amps, lamps and direct sun, where the air matches the
# site (not in a sealed case, not in a draught). Weatherproof the Feather with
# a vented housing and give the USB and battery leads strain relief. Use USB
# 5 V for show use; the LiPo is a short ride-through and its readings are
# informational. Never leave a charging pack in a hot flight case.
#
# First flash (USB): copy secrets.example.yaml to secrets.yaml and fill it in,
# then hold BOOT, tap RESET, release BOOT (ROM bootloader) and run
#     esphome run stagewatch-feather-s3-dps310.yaml
# choosing the COM port; tap RESET afterwards. This replaces Adafruit's UF2
# bootloader (restore it with Adafruit's web installer if needed). Later updates
# go over Wi-Fi (OTA). The api_encryption_key comes from secrets.yaml (one shared key
# is fine); paste the same key into Stagewatch when adopting. Secrets used: wifi_ssid, wifi_password,
# ota_password, api_encryption_key, wifi_ap_password.
#
# Status: validated with `esphome config`; untested on hardware.
#
# Battery gauge chip depends on board revision: MAX17048 (0x36, newer) or
# LC709203F (0x0B, older); see the sensor section.

substitutions:
  node_name: stagewatch-baro-s3-1       # unique per node: becomes <name>.local
  friendly_name: "Stagewatch Baro S3 1"
  board: adafruit_feather_esp32s3       # 4MB flash / 2MB PSRAM board (5477)
  flash_size: 4MB
  dps310_address: "0x77"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # Amber = booting / no API client yet.
      - light.turn_on:
          id: status_led
          brightness: 15%
          red: 100%
          green: 55%
          blue: 0%

esp32:
  board: ${board}
  flash_size: ${flash_size}
  framework:
    type: esp-idf

# PSRAM (2MB quad) is fitted but not needed. To enable:
# psram:
#   mode: quad
#   speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG        # native USB; drop if you see no logs

# Native API: Stagewatch connects to this. reboot_timeout restarts the node if
# no client has been connected for 15 minutes (recovers a stuck Wi-Fi stack).
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min
  on_client_connected:
    - light.turn_on:
        id: status_led
        brightness: 8%
        red: 0%
        green: 100%
        blue: 0%
  on_client_disconnected:
    - light.turn_on:
        id: status_led
        brightness: 15%
        red: 100%
        green: 55%
        blue: 0%

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Several networks (see the guide, "Moving between sites"): replace ssid and
  # password above with a `networks:` list of ssid / password pairs, e.g.
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid_2
  #     password: !secret wifi_password_2
  # (add wifi_ssid_2 / wifi_password_2 to secrets.yaml first).
  # Fallback access point if the node cannot join Wi-Fi.
  ap:
    ssid: "${node_name}"
    password: !secret wifi_ap_password
  on_disconnect:
    - light.turn_on:
        id: status_led
        brightness: 15%
        red: 100%
        green: 55%
        blue: 0%

captive_portal:

# Power enables, applied at switch setup (before the sensors are probed).
switch:
  - platform: gpio
    id: i2c_power
    pin: GPIO7                          # I2C_POWER: STEMMA QT port 3V3 enable
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: neopixel_power
    pin: GPIO21                         # NEOPIXEL_POWER
    restore_mode: ALWAYS_ON
    internal: true

i2c:
  sda: GPIO3
  scl: GPIO4
  frequency: 100kHz                     # gentle on a long STEMMA QT cable
  scan: true

# Status LED: amber = no Wi-Fi / no API client, green (dim) = API connected.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO33
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF

sensor:
  - platform: dps310
    address: ${dps310_address}
    update_interval: 2s                 # raw reading every 2 s
    pressure:
      name: "Pressure"                  # hPa; Stagewatch converts to Pa
      device_class: atmospheric_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2              # 0.01 hPa = 1 Pa
      filters:
        # Mean of the last 5 readings (10 s), published every reading.
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
        # Per-board trim, if you prefer it in firmware (otherwise use the
        # Stagewatch admin offset, not both):
        # - offset: 0.0
    # Die temperature, NOT air temperature: disabled on purpose (see header).
    # temperature:
    #   name: "Pressure sensor die temperature"
    #   accuracy_decimals: 1

  # Battery gauge (informational). Enable ONE, matching your board.
  # MAX17048 (0x36): ESPHome has no max17048 platform; max17043 reads the same
  # registers, but its docs list only the MAX17043, so check the values look sane
  # (about 3.0-4.2 V). With no battery fitted readings may be odd or absent.
  - platform: max17043
    update_interval: 60s
    battery_voltage:
      name: "Battery voltage"
    battery_level:
      name: "Battery"

  # LC709203F (older boards, 0x0B):
  # - platform: lc709203f
  #   update_interval: 60s
  #   size: 500                         # pack capacity in mAh
  #   voltage: 3.7
  #   battery_voltage:
  #     name: "Battery voltage"
  #   battery_level:
  #     name: "Battery"

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s
