# Stagewatch barometric-pressure node: Seeed XIAO ESP32C6 + DPS310 precision
# barometric sensor on four jumper wires. Wi-Fi 6 (2.4 GHz), tiny and cheap.
# Use one file for each C6 and change node_name / friendly_name / api key.
# See also stagewatch-feather-s3-dps310.yaml and
# stagewatch-feather-esp8266-mpl3115a2.yaml.
#
# Hardware:
#   - Seeed XIAO ESP32C6 (header pins soldered)
#   - DPS310 breakout with VIN, GND, SCL, SDA pins (e.g. Adafruit 4494 used
#     without the STEMMA QT cable). Check your breakout takes 3.3 V on VIN.
#   - 4 female-female jumper wires, short (10-20 cm); USB-C data cable and a
#     stable 5 V supply.
#
# Wiring (colour-coded; the colours match the STEMMA QT convention):
#   XIAO pin           GPIO    DPS310 pin   Wire
#   3V3                -       VIN          red
#   GND                -       GND          black
#   D4 (SDA)           GPIO22  SDA          blue
#   D5 (SCL)           GPIO23  SCL          yellow
#   (Seeed pin map: D4 = GPIO22 = SDA and D5 = GPIO23 = SCL are the C6's default
#   I2C pins; ESPHome's own default for the C6 is the same pair, but they are
#   set explicitly below.)
#
# I2C address: 0x77 by default; 0x76 if the breakout's SDO / address pin is tied
# low (Adafruit 4494: bridge the jumper). The i2c scan below logs what it finds.
#
# ESPHome options (https://esphome.io/components/sensor/dps310/): address,
# update_interval, temperature, pressure. There is NO oversampling / precision
# option (fixed driver settings), so smoothing is done with the filter below.
# Checked against ESPHome 2026.9.1. Pressure is hPa; Stagewatch converts to Pa.
#
# Sensor facts: absolute accuracy about +/-1 hPa, relative about +/-0.06 hPa.
# Trim each sensor's offset in the Stagewatch admin (per-sensor offset), not
# here. Keep the sensor out of draughts and sealed boxes: it must see the same
# static pressure as the outside air.
#
# Stagewatch entities (mapping.py: device_class decides the Kind):
#   "Pressure"    device_class atmospheric_pressure, hPa -> Kind.PRESSURE (Pa)
#   "WiFi signal" device_class signal_strength, dBm      -> Kind.SIGNAL
#   (no battery gauge on this board, so no Battery entity)
#
# Temperature: the DPS310 temperature is DIE temperature, not air temperature,
# so it is disabled (Stagewatch averages every device_class temperature into the
# site temperature; same convention as the chip temperature in
# stagewatch-s3-tft-ms8607.yaml). If you enable it, untick "Average" for it in
# Stagewatch admin.
#
# Mounting: keep the DPS310 a hand's length from the XIAO and the USB supply
# (the C6 warms up in a closed case), out of sun, lamps, amp racks and
# draughts. Jumper wires are for testing and bench use: for a permanent
# installation solder the leads or use a Qwiic/STEMMA QT cable, put the pair in
# a vented housing and add strain relief on the USB lead.
#
# External antenna (OPTIONAL, OFF by default, NOT YET TESTED ON HARDWARE):
#   The node uses the board's built-in ceramic antenna. That is the default and
#   is fine for most shows. Consider the external antenna only if the signal at
#   the node is weak, the node sits in a metal case, or you want a larger or
#   directional antenna. It needs a 2.4 GHz antenna with a U.FL (IPEX) plug,
#   fitted to the socket BEFORE you enable it. Enable it by uncommenting the
#   "External antenna" block near the end of this file (it holds GPIO3 low, then
#   GPIO14 high, per the Seeed wiki "RF SWITCH" section, before the radio is
#   used). WARNING: with the block enabled and no antenna fitted the node will
#   lose Wi-Fi, and the fallback hotspot will be unreachable too, so you will
#   need a USB cable to flash it back. To go back to the built-in antenna,
#   re-comment the block and flash over USB.
#
# First flash (USB): copy secrets.example.yaml to secrets.yaml and fill it in.
# Hold BOOT, plug in USB, release BOOT (or hold BOOT and tap RESET), then
#     esphome run stagewatch-xiao-esp32c6-dps310.yaml
# Later updates go over Wi-Fi (OTA). The api_encryption_key comes from
# secrets.yaml (one shared key is fine); paste it into Stagewatch when adopting. Secrets used:
# wifi_ssid, wifi_password, ota_password, api_encryption_key, wifi_ap_password.
#
# Status: validated with `esphome config` and run on a real XIAO ESP32C6 with a DPS310
# (address jumper bridged: `dps310_address: "0x76"`; adopted in Stagewatch). The user LED
# (GPIO15, active low) stayed off while healthy, which is the intended behaviour; if it is
# lit while all is well on your board, remove `inverted: true` below.

substitutions:
  node_name: stagewatch-baro-c6-1       # unique per node: becomes <name>.local
  friendly_name: "Stagewatch Baro C6 1"
  dps310_address: "0x77"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on: status_led       # lit = booting / no hub

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG        # native USB; drop if you see no logs

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min
  on_client_connected:
    - light.turn_off: status_led        # off = all well
  on_client_disconnected:
    - light.turn_on: status_led

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.51
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Several networks (see the guide, "Moving between sites"): replace ssid and
  # password above with a `networks:` list of ssid / password pairs, e.g.
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid_2
  #     password: !secret wifi_password_2
  # (add wifi_ssid_2 / wifi_password_2 to secrets.yaml first).
  # Fallback access point if the node cannot join Wi-Fi.
  ap:
    ssid: "${node_name}"
    password: !secret wifi_ap_password
  on_disconnect:
    - light.turn_on: status_led

captive_portal:

i2c:
  sda: GPIO22                           # D4
  scl: GPIO23                           # D5
  frequency: 100kHz                     # gentle on jumper wires
  scan: true

# Status LED (user LED, GPIO15, active low): off normally, lit when Wi-Fi or the
# hub connection is lost.
output:
  - platform: gpio
    id: user_led
    pin:
      number: GPIO15
      inverted: true

light:
  - platform: binary
    id: status_led
    internal: true
    output: user_led
    restore_mode: ALWAYS_OFF

sensor:
  - platform: dps310
    address: ${dps310_address}
    update_interval: 2s
    pressure:
      name: "Pressure"                  # hPa; Stagewatch converts to Pa
      device_class: atmospheric_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 5              # 10 s mean
            send_every: 1
        # - offset: 0.0                 # or use the Stagewatch admin offset, not both
    # Die temperature, NOT air temperature: disabled on purpose (see header).
    # temperature:
    #   name: "Pressure sensor die temperature"
    #   accuracy_decimals: 1

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s

# --- External antenna (OPTIONAL: uncomment the whole block to use) ------------
# Read the "External antenna" note in the header first. Fit a U.FL antenna BEFORE
# flashing this. Per Seeed (wiki.seeedstudio.com/xiao_esp32c6_getting_started/,
# "RF SWITCH"): GPIO3 must be LOW, then GPIO14 HIGH selects the U.FL socket.
# The gpio switch for GPIO3 is inverted so "on" = pin low. The template switch
# runs at boot (restore_mode ALWAYS_ON), waits 100 ms, then sets GPIO14 high.
# switch:
#   - platform: gpio
#     id: rf_switch_power               # GPIO3 held LOW
#     pin:
#       number: GPIO3
#       inverted: true
#     restore_mode: ALWAYS_ON
#     internal: true
#   - platform: gpio
#     id: rf_switch_select              # GPIO14 held HIGH = external antenna
#     pin: GPIO14
#     restore_mode: ALWAYS_OFF
#     internal: true
#   - platform: template
#     id: rf_external_antenna
#     optimistic: true
#     restore_mode: ALWAYS_ON
#     internal: true
#     turn_on_action:
#       - switch.turn_on: rf_switch_power
#       - delay: 100ms
#       - switch.turn_on: rf_switch_select
