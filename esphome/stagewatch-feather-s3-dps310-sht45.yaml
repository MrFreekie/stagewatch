# Stagewatch all-in-one environment node: Adafruit ESP32-S3 Feather (product 5477,
# 4MB flash, 2MB PSRAM) + Adafruit DPS310 barometric sensor (product 4494) +
# Adafruit Sensirion SHT45 temperature / humidity sensor (product 5665), both on
# STEMMA QT. Wi-Fi. This is the second build option for the pressure nodes: the
# DPS310-only build is stagewatch-feather-s3-dps310.yaml (the first option). The
# XIAO equivalent is stagewatch-xiao-esp32c6-dps310-sht45.yaml.
#
# Hardware (no soldering):
#   - Adafruit ESP32-S3 Feather, 4MB Flash, 2MB PSRAM (5477)
#   - Adafruit DPS310 breakout (4494), STEMMA QT
#   - Adafruit SHT45 breakout (5665), STEMMA QT (any SHT45 breakout with 3V3, GND,
#     SDA, SCL works)
#   - 2 STEMMA QT cables: Feather port to the DPS310 (100 mm or longer), and
#     DPS310 second port to the SHT45 (100-200 mm, see Mounting)
#   - USB-C data cable and a stable 5 V supply. Optional protected 3.7 V LiPo
#     (JST-PH, check the +/- markings: many packs are reversed).
#
# Wiring (STEMMA QT cables, daisy-chained; Adafruit pinout). Both sensors share
# one I2C bus, so every wire is simply passed on:
#   Feather pin        GPIO   DPS310 / SHT45 pin   Wire
#   3V3                -      VIN                  red
#   GND                -      GND                  black
#   SDA                GPIO3  SDA                  blue
#   SCL                GPIO4  SCL                  yellow
#   The STEMMA QT port's 3V3 is switched by GPIO7 (I2C_POWER): it must be
#   driven HIGH or the sensors are unpowered; this config does that at boot.
#   On-board NeoPixel: data GPIO33, power-enable GPIO21 (driven HIGH below).
#   Boot button: GPIO0.
#
# I2C addresses (no clash):
#   DPS310 0x77 by default; 0x76 if you bridge the SDO/address jumper on the
#   breakout (the owner's boards bridged give 0x76: set dps310_address below).
#   SHT45  0x44 (fixed).
# The i2c scan below logs what it finds.
#
# ESPHome options:
#   DPS310 (https://esphome.io/components/sensor/dps310/): address,
#   update_interval, temperature, pressure. No oversampling option (fixed driver
#   settings), so smoothing is done with the filter below.
#   SHT4x (https://esphome.io/components/sensor/sht4x/): address (default 0x44),
#   precision (High / Med / Low, default High), heater_max_duty (default 0.0 =
#   heater off; max 0.05), heater_power, heater_time, update_interval (default 60s).
#   Checked against ESPHome 2026.9.1. Pressure is in hPa; Stagewatch converts to Pa.
#
# Sensor facts: DPS310 absolute accuracy about +/-1 hPa, relative about +/-0.06 hPa;
# trim each sensor's offset in the Stagewatch admin (per-sensor offset), not here.
# SHT45 about +/-0.1 degC and +/-1 %RH. Keep the DPS310 out of wind and fan
# airflow and out of sealed boxes (it must see the outside static pressure).
#
# Stagewatch entities (mapping.py: device_class decides the Kind):
#   "Temperature" device_class temperature, degC      -> Kind.TEMPERATURE (SHT45, AIR)
#   "Humidity"    device_class humidity, %             -> Kind.HUMIDITY    (SHT45)
#   "Pressure"    device_class atmospheric_pressure, hPa -> Kind.PRESSURE (Pa) (DPS310)
#   "Battery"     device_class battery, %              -> Kind.BATTERY
#   "Battery voltage"                                  -> generic
#   "WiFi signal" device_class signal_strength, dBm    -> Kind.SIGNAL
# Temperature and Humidity are AIR measurements and feed the site average.
#
# DPS310 die temperature: the DPS310 temperature is the DIE temperature (used
# internally to compensate pressure), not the air temperature. Stagewatch averages
# anything with device_class temperature into the site temperature, so it is
# DISABLED here (the SHT45 is the air temperature), the same convention as the
# chip temperature in stagewatch-s3-tft-ms8607.yaml. If you enable it (useful to
# diagnose heating), untick "Average" for it in Stagewatch admin (Sensors:
# calibration & averaging).
#
# Mounting: the Feather, its regulator and any LiPo warm the air around them, which
# would corrupt both temperature and humidity (warm air reads drier). Mount the
# SHT45 on a short lead 5 to 10 cm away from the board and the regulator, with the
# sensor hanging in free, shaded air: below or beside, not above, the Feather. Out of
# direct sun, lamps and amp heat. Outdoors, put it in a small radiation shield
# (louvred Stevenson-type screen); a sealed box gives wrong readings. Do not fit
# the DPS310 in the same draught as a fan. Weatherproof the Feather with a vented
# housing and give the USB and battery leads strain relief. Use USB 5 V for show
# use; the LiPo is a short ride-through and its readings are informational.
# Never leave a charging pack in a hot flight case.
#
# First flash (USB): copy secrets.example.yaml to secrets.yaml and fill it in,
# then hold BOOT, tap RESET, release BOOT (ROM bootloader) and run
#     esphome run stagewatch-feather-s3-dps310-sht45.yaml
# choosing the COM port; tap RESET afterwards. This replaces Adafruit's UF2
# bootloader (restore it with Adafruit's web installer if needed). Later updates
# go over Wi-Fi (OTA). Use a different api_encryption_key per node and paste the
# same key into Stagewatch when adopting. Secrets used: wifi_ssid, wifi_password,
# ota_password, api_encryption_key, wifi_ap_password.
#
# Status: validated with `esphome config`; untested on hardware.
#
# Battery gauge chip depends on board revision: MAX17048 (0x36, newer) or
# LC709203F (0x0B, older); see the sensor section.

substitutions:
  node_name: stagewatch-env-s3-1        # unique per node: becomes <name>.local
  friendly_name: "Stagewatch Env S3 1"
  board: adafruit_feather_esp32s3       # 4MB flash / 2MB PSRAM board (5477)
  flash_size: 4MB
  # DPS310: "0x77" by default; "0x76" when the SDO/address jumper is bridged
  # (as on the owner's boards).
  dps310_address: "0x77"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      # Amber = booting / no API client yet.
      - light.turn_on:
          id: status_led
          brightness: 15%
          red: 100%
          green: 55%
          blue: 0%

esp32:
  board: ${board}
  flash_size: ${flash_size}
  framework:
    type: esp-idf

# PSRAM (2MB quad) is fitted but not needed. To enable:
# psram:
#   mode: quad
#   speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG        # native USB; drop if you see no logs

# Native API: Stagewatch connects to this. reboot_timeout restarts the node if
# no client has been connected for 15 minutes (recovers a stuck Wi-Fi stack).
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min
  on_client_connected:
    - light.turn_on:
        id: status_led
        brightness: 8%
        red: 0%
        green: 100%
        blue: 0%
  on_client_disconnected:
    - light.turn_on:
        id: status_led
        brightness: 15%
        red: 100%
        green: 55%
        blue: 0%

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.50
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Several networks (see the guide, "Moving between sites"): replace ssid and
  # password above with a `networks:` list of ssid / password pairs, e.g.
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid_2
  #     password: !secret wifi_password_2
  # (add wifi_ssid_2 / wifi_password_2 to secrets.yaml first).
  # Fallback access point if the node cannot join Wi-Fi.
  ap:
    ssid: "${node_name}"
    password: !secret wifi_ap_password
  on_disconnect:
    - light.turn_on:
        id: status_led
        brightness: 15%
        red: 100%
        green: 55%
        blue: 0%

captive_portal:

# Power enables, applied at switch setup (before the sensors are probed).
switch:
  - platform: gpio
    id: i2c_power
    pin: GPIO7                          # I2C_POWER: STEMMA QT port 3V3 enable
    restore_mode: ALWAYS_ON
    internal: true
  - platform: gpio
    id: neopixel_power
    pin: GPIO21                         # NEOPIXEL_POWER
    restore_mode: ALWAYS_ON
    internal: true

i2c:
  sda: GPIO3
  scl: GPIO4
  frequency: 100kHz                     # gentle on long STEMMA QT cables, shared bus
  scan: true

# Status LED: amber = no Wi-Fi / no API client, green (dim) = API connected.
light:
  - platform: esp32_rmt_led_strip
    id: status_led
    internal: true
    pin: GPIO33
    num_leds: 1
    chipset: ws2812
    channel_colors: GRB
    restore_mode: ALWAYS_OFF

sensor:
  # SHT45: AIR temperature and humidity (feed the Stagewatch site average).
  - platform: sht4x
    address: 0x44
    update_interval: 5s
    precision: High
    heater_max_duty: 0.0                # heater off: it would skew temperature
    temperature:
      name: "Temperature"
      accuracy_decimals: 2
    humidity:
      name: "Humidity"
      accuracy_decimals: 1

  - platform: dps310
    address: ${dps310_address}
    update_interval: 2s                 # raw reading every 2 s
    pressure:
      name: "Pressure"                  # hPa; Stagewatch converts to Pa
      device_class: atmospheric_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2              # 0.01 hPa = 1 Pa
      filters:
        # Mean of the last 5 readings (10 s), published every reading.
        - sliding_window_moving_average:
            window_size: 5
            send_every: 1
        # Per-board trim, if you prefer it in firmware (otherwise use the
        # Stagewatch admin offset, not both):
        # - offset: 0.0
    # Die temperature, NOT air temperature: disabled on purpose (see header).
    # temperature:
    #   name: "Pressure sensor die temperature"
    #   accuracy_decimals: 1

  # Battery gauge (informational). Enable ONE, matching your board.
  # MAX17048 (0x36): ESPHome has no max17048 platform; max17043 reads the same
  # registers, but its docs list only the MAX17043, so check the values look sane
  # (about 3.0-4.2 V). With no battery fitted readings may be odd or absent.
  - platform: max17043
    update_interval: 60s
    battery_voltage:
      name: "Battery voltage"
    battery_level:
      name: "Battery"

  # LC709203F (older boards, 0x0B):
  # - platform: lc709203f
  #   update_interval: 60s
  #   size: 500                         # pack capacity in mAh
  #   voltage: 3.7
  #   battery_voltage:
  #     name: "Battery voltage"
  #   battery_level:
  #     name: "Battery"

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s
