# Copy to secrets.yaml (gitignored) and fill in real values. Never commit secrets.yaml.
wifi_ssid: "YOUR_CONTROL_NETWORK"
wifi_password: "CHANGE_ME"
ota_password: "CHANGE_ME"
# Make a different key for each node. Paste ONE of these into a terminal and copy the result:
#   Windows (PowerShell):
#     $b = New-Object byte[] 32; [Security.Cryptography.RandomNumberGenerator]::Create().GetBytes($b); [Convert]::ToBase64String($b)
#   Linux / macOS:
#     openssl rand -base64 32
# The result is 44 characters ending in "=". Put it below, and paste the same key into Stagewatch
# when you adopt the node.
api_encryption_key: "PASTE_32_BYTE_BASE64_KEY_HERE"
