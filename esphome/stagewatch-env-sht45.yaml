# Stagewatch environment node: ESP32 + SHT45 (higher-accuracy temperature/RH,
# about ±0.1 degC / ±1 %RH, no pressure). Stagewatch uses pressure from other
# nodes, or falls back to the site altitude.
#
# Wiring: SHT45 VCC->3V3, GND->GND, SDA->GPIO21, SCL->GPIO22.

substitutions:
  node_name: stagewatch-sht-1
  friendly_name: "Stagewatch SHT45 1"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

i2c:
  sda: GPIO21
  scl: GPIO22

sensor:
  - platform: sht4x
    update_interval: 5s
    precision: High
    heater_max_duty: 0.0               # keep the heater off: it skews temperature
    temperature:
      name: "Temperature"
    humidity:
      name: "Humidity"
