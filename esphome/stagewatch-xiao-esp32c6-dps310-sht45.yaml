# Stagewatch all-in-one environment node: Seeed XIAO ESP32C6 + DPS310 precision
# barometric sensor + Sensirion SHT45 temperature / humidity sensor, all on the
# same four jumper wires (both sensors share the I2C bus). Wi-Fi 6 (2.4 GHz), tiny
# and cheap. This is the second build option for the pressure nodes: the
# DPS310-only build is stagewatch-xiao-esp32c6-dps310.yaml (the first option). Use
# one file for each C6 and change node_name / friendly_name / api key. The Feather
# equivalent is stagewatch-feather-s3-dps310-sht45.yaml.
#
# Hardware:
#   - Seeed XIAO ESP32C6 (header pins soldered)
#   - DPS310 breakout with VIN, GND, SCL, SDA pins (e.g. Adafruit 4494 used
#     without the STEMMA QT cable). Check your breakout takes 3.3 V on VIN.
#   - SHT45 breakout with 3V3/VIN, GND, SCL, SDA pins (e.g. Adafruit 5665 used
#     without the STEMMA QT cable; it takes 3.3 V or 5 V on VIN, use 3V3).
#   - Female-female jumper wires: 4 to the XIAO, plus 4 from the DPS310 pins
#     to the SHT45 pins (or one Qwiic/STEMMA QT cable between the two breakouts).
#     Keep the DPS310 leads short (10-20 cm); the SHT45 lead is 5-10 cm or more
#     (see Mounting). USB-C data cable and a stable 5 V supply.
#
# Wiring (colour-coded; the colours match the STEMMA QT convention). The two
# sensors are wired in parallel on the same four wires:
#   XIAO pin           GPIO    DPS310 pin   SHT45 pin   Wire
#   3V3                -       VIN          VIN (3V3)   red
#   GND                -       GND          GND         black
#   D4 (SDA)           GPIO22  SDA          SDA         blue
#   D5 (SCL)           GPIO23  SCL          SCL         yellow
#   (Seeed pin map: D4 = GPIO22 = SDA and D5 = GPIO23 = SCL are the C6's default
#   I2C pins; ESPHome's own default for the C6 is the same pair, but they are
#   set explicitly below.)
#
# I2C addresses (no clash):
#   DPS310 0x77 by default; 0x76 if the breakout's SDO / address pin is tied low
#   (Adafruit 4494: bridge the jumper; the owner's board bridged gives 0x76, so
#   set dps310_address below).
#   SHT45  0x44 (fixed).
# The i2c scan below logs what it finds.
#
# ESPHome options:
#   DPS310 (https://esphome.io/components/sensor/dps310/): address,
#   update_interval, temperature, pressure. No oversampling option (fixed driver
#   settings), so smoothing is done with the filter below.
#   SHT4x (https://esphome.io/components/sensor/sht4x/): address (default 0x44),
#   precision (High / Med / Low, default High), heater_max_duty (default 0.0 =
#   heater off; max 0.05), heater_power, heater_time, update_interval (default 60s).
#   Checked against ESPHome 2026.9.1. Pressure is hPa; Stagewatch converts to Pa.
#
# Sensor facts: DPS310 absolute accuracy about +/-1 hPa, relative about +/-0.06 hPa;
# SHT45 about +/-0.1 degC and +/-1 %RH. Trim each sensor's offset in the
# Stagewatch admin (per-sensor offset), not here. Keep the DPS310 out of draughts
# and sealed boxes: it must see the same static pressure as the outside air.
#
# Stagewatch entities (mapping.py: device_class decides the Kind):
#   "Temperature" device_class temperature, degC      -> Kind.TEMPERATURE (SHT45, AIR)
#   "Humidity"    device_class humidity, %             -> Kind.HUMIDITY    (SHT45)
#   "Pressure"    device_class atmospheric_pressure, hPa -> Kind.PRESSURE (Pa) (DPS310)
#   "WiFi signal" device_class signal_strength, dBm    -> Kind.SIGNAL
#   (no battery gauge on this board, so no Battery entity)
# Temperature and Humidity are AIR measurements and feed the site average.
#
# DPS310 die temperature: the DPS310 temperature is DIE temperature, not air
# temperature, so it is DISABLED here (the SHT45 is the air temperature).
# Stagewatch averages every device_class temperature into the site temperature;
# same convention as the chip temperature in stagewatch-s3-tft-ms8607.yaml. If you
# enable it, untick "Average" for it in Stagewatch admin.
#
# Mounting: the XIAO, its regulator and the USB supply warm the air around them,
# which corrupts temperature and humidity (warm air reads drier). Mount the SHT45
# on a short lead 5 to 10 cm away from the board and the regulator, hanging in
# free, shaded air (below or beside the XIAO, not above it), out of direct sun,
# lamps, amp racks and draughts. Outdoors, put it in a small radiation shield; a
# sealed box gives wrong readings. Jumper wires are for testing and bench use: for
# a permanent installation solder the leads or use a Qwiic/STEMMA QT cable, put the
# board in a vented housing and add strain relief on the USB lead.
#
# Antenna: the board uses its ceramic antenna by default. For an external
# antenna (U.FL) GPIO3 must be driven LOW, then GPIO14 HIGH (Seeed wiki); not
# configured here.
#
# First flash (USB): copy secrets.example.yaml to secrets.yaml and fill it in.
# Hold BOOT, plug in USB, release BOOT (or hold BOOT and tap RESET), then
#     esphome run stagewatch-xiao-esp32c6-dps310-sht45.yaml
# Later updates go over Wi-Fi (OTA). Use a different api_encryption_key per
# node (paste the same key into Stagewatch when adopting). Secrets used:
# wifi_ssid, wifi_password, ota_password, api_encryption_key, wifi_ap_password.
#
# Status: validated with `esphome config`; the SHT45 addition is untested on
# hardware (the DPS310-only build ran on a real XIAO ESP32C6). The user LED
# (GPIO15, active low) stays off while healthy; if it is lit while all is well on
# your board, remove `inverted: true` below.

substitutions:
  node_name: stagewatch-env-c6-1        # unique per node: becomes <name>.local
  friendly_name: "Stagewatch Env C6 1"
  # DPS310: "0x77" by default; "0x76" when the SDO/address jumper is bridged
  # (as on the owner's board).
  dps310_address: "0x77"

esphome:
  name: ${node_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - light.turn_on: status_led       # lit = booting / no hub

esp32:
  board: seeed_xiao_esp32c6
  variant: esp32c6
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG        # native USB; drop if you see no logs

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 15min
  on_client_connected:
    - light.turn_off: status_led        # off = all well
  on_client_disconnected:
    - light.turn_on: status_led

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Uncomment for a fixed address on the show control network:
  # manual_ip:
  #   static_ip: 192.168.1.51
  #   gateway: 192.168.1.1
  #   subnet: 255.255.255.0
  # Several networks (see the guide, "Moving between sites"): replace ssid and
  # password above with a `networks:` list of ssid / password pairs, e.g.
  # networks:
  #   - ssid: !secret wifi_ssid
  #     password: !secret wifi_password
  #   - ssid: !secret wifi_ssid_2
  #     password: !secret wifi_password_2
  # (add wifi_ssid_2 / wifi_password_2 to secrets.yaml first).
  # Fallback access point if the node cannot join Wi-Fi.
  ap:
    ssid: "${node_name}"
    password: !secret wifi_ap_password
  on_disconnect:
    - light.turn_on: status_led

captive_portal:

i2c:
  sda: GPIO22                           # D4
  scl: GPIO23                           # D5
  frequency: 100kHz                     # gentle on jumper wires, shared bus
  scan: true

# Status LED (user LED, GPIO15, active low): off normally, lit when Wi-Fi or the
# hub connection is lost.
output:
  - platform: gpio
    id: user_led
    pin:
      number: GPIO15
      inverted: true

light:
  - platform: binary
    id: status_led
    internal: true
    output: user_led
    restore_mode: ALWAYS_OFF

sensor:
  # SHT45: AIR temperature and humidity (feed the Stagewatch site average).
  - platform: sht4x
    address: 0x44
    update_interval: 5s
    precision: High
    heater_max_duty: 0.0                # heater off: it would skew temperature
    temperature:
      name: "Temperature"
      accuracy_decimals: 2
    humidity:
      name: "Humidity"
      accuracy_decimals: 1

  - platform: dps310
    address: ${dps310_address}
    update_interval: 2s
    pressure:
      name: "Pressure"                  # hPa; Stagewatch converts to Pa
      device_class: atmospheric_pressure
      unit_of_measurement: "hPa"
      accuracy_decimals: 2
      filters:
        - sliding_window_moving_average:
            window_size: 5              # 10 s mean
            send_every: 1
        # - offset: 0.0                 # or use the Stagewatch admin offset, not both
    # Die temperature, NOT air temperature: disabled on purpose (see header).
    # temperature:
    #   name: "Pressure sensor die temperature"
    #   accuracy_decimals: 1

  - platform: wifi_signal
    name: "WiFi signal"
    update_interval: 30s
