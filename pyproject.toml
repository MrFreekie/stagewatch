[project]
name = "stagewatch"
version = "0.2.0"
description = "Home Assistant-style show-site monitoring hub for live concert audio"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
authors = [
    { name = "MrFreekie", email = "fohengineer@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "aioesphomeapi>=46.6.0",
    "fastapi>=0.142.0",
    "ifaddr>=0.2.0",
    "python-osc>=1.10.2",
    "pyyaml>=6.0.3",
    "tzdata>=2026.4",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
stagewatch = "stagewatch.__main__:main"

[build-system]
requires = ["uv_build>=0.11.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.uv]
# Stagewatch targets Windows and Linux (incl. Raspberry Pi). Locking only these platforms
# lets security fixes land even when a dependency caps a package on other platforms
# (aioesphomeapi caps cryptography < 49 on Intel macOS only).
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]
